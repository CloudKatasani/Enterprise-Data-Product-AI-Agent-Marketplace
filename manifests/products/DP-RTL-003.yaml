apiVersion: marketplace/v1
kind: DataProduct
metadata:
  id: DP-RTL-003
  name: "Visit & Conversion Funnel"
  industry: retail
  domain: customer
  archetype: source_aligned
  tier: tier1
  owner:
    party_id: PTY-0040
    team: "Retail Customer Analytics"
    escalation: "#dp-visits"
  certification: certified
spec:
  purpose: >-
    One row per store or site visit, converted or not, so conversion, abandonment and dwell can
    be measured against the visits that did not buy rather than only the ones that did.
  grain: "one row per visit"
  history_months: 24
  known_limitations: >-
    Store visits are counted by door sensor and are attributed to a trading session, not to a
    person; a group entering together is one visit. Digital visits are session-scoped and reset
    after 30 minutes idle, so a shopper returning later in the day is two visits. Dwell is
    measured to the last observed event and is right-censored for visits that end without one.
  upstream_sources: [SRC-POS, SRC-DOOR-COUNTER, SRC-WEB-ANALYTICS, SRC-APP-EVENTS]
  entities: [visit, transaction, store, customer]
  certified_kpis: [KPI-CONVRATE-048, KPI-ABANDON-076, KPI-VISITDWELL-077]
  columns:
    - name: visit_id
      type: string
      business_name: "Visit ID"
      nullable: false
      classification: [identifier]
      sensitivity: internal
      description: >-
        Store or site visit. The grain of this product: one row exists whether or not the visit
        ended in a purchase.
    - name: transaction_id
      type: string
      business_name: "Transaction ID"
      nullable: true
      classification: [identifier]
      sensitivity: internal
      description: >-
        Transaction the visit produced, null when the visit did not convert. This column is the
        reason the product exists: a transaction-grain table cannot express a visit that bought
        nothing.
    - name: visit_timestamp
      type: timestamp
      business_name: "Visit Timestamp"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Start of the visit, in the trading location's local time.
    - name: business_date
      type: date
      business_name: "Business Date"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Trading day the visit is accounted to.
    - name: region
      type: string
      business_name: "Region"
      nullable: false
      classification: [location]
      sensitivity: internal
      description: >-
        Region of the store, or of the site visitor by geolocation.
    - name: channel
      type: string
      business_name: "Channel"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Channel the visit arrived through.
    - name: store_format
      type: string
      business_name: "Store Format"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Format of the trading location. Digital visits carry the format of the fulfilling store.
    - name: entry_category
      type: string
      business_name: "Entry Category"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        First merchandise category the visit engaged with.
    - name: device_class
      type: string
      business_name: "Device Class"
      nullable: true
      classification: []
      sensitivity: internal
      description: >-
        Device the visit was made on, null for a store visit.
    - name: traffic_source
      type: string
      business_name: "Traffic Source"
      nullable: true
      classification: []
      sensitivity: internal
      description: >-
        How the visit arrived, null for a store visit.
    - name: loyalty_identified
      type: boolean
      business_name: "Loyalty Identified"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        True when the visit was matched to a loyalty member.
    - name: converted
      type: boolean
      business_name: "Converted"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        True when the visit produced a transaction.
    - name: basket_started
      type: boolean
      business_name: "Basket Started"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        True when at least one item entered the basket, whether or not it was bought.
    - name: basket_abandoned
      type: boolean
      business_name: "Basket Abandoned"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        True when a basket was started and the visit ended without a purchase.
    - name: items_viewed
      type: integer
      business_name: "Items Viewed"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Items handled or viewed during the visit.
    - name: dwell_seconds
      type: number
      business_name: "Dwell Seconds"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Seconds from the first to the last observed event in the visit.
    - name: net_sales
      type: number
      business_name: "Net Sales"
      nullable: true
      classification: [financial]
      sensitivity: internal
      description: >-
        Net sales the visit produced, null when it did not convert.
  contract:
    version: 1.0.0
    schema_stability: additive_only
    guarantees:
      freshness:
        target: "every 1 hour"
        p95_minutes: 12
        measured: per_partition
      availability:
        target_pct: 99.5
        window: monthly
      completeness:
        required_fields_pct: 99.5
      accuracy:
        reconciliation_variance_pct: 0.5
        against: "point_of_sale_system_of_record"
    deprecation_policy:
      notice_days: 60
      minimum_parallel_run_days: 30
    support:
      hours: "extended"
      p1_response_minutes: 30
      on_call: "pagerduty://retail-dp"
    classification:
      max_sensitivity: internal
      contains_pii: false
      residency: [US, EU]
    consumer_obligations:
      - "Visit counts are sensor and session derived and must not be reported as unique shoppers"
      - "Dwell is right-censored and must be labelled as such where it is reported alone"
    breach_process: >-
      Auto-incident raised and affected consumers notified within 30 minutes of detection.
  quality_rules:
    - id: QR-RTL-003-01
      dimension: completeness
      column: visit_id
      rule: not_null
      threshold_pct: 100
      severity: critical
    - id: QR-RTL-003-02
      dimension: uniqueness
      columns: [visit_id]
      rule: unique_at_grain
      threshold_pct: 99.99
      severity: critical
    - id: QR-RTL-003-03
      dimension: freshness
      rule: partition_completion_by
      target: "1h"
      tolerance_minutes: 12
      severity: critical
    - id: QR-RTL-003-04
      dimension: validity
      column: channel
      rule: in_reference_set
      threshold_pct: 99.9
      severity: high
    - id: QR-RTL-003-05
      dimension: consistency
      column: dwell_seconds
      rule: non_negative
      threshold_pct: 100
      severity: high
  endpoints: [sql, mcp, stream]
  demo_tier:
    synthetic: true
    rows_target: 780000
    preserve: [distribution, seasonality, referential_integrity, cardinality]
    expected_quality: 91
    planted_patterns:
      - id: digital-conversion-gap
        description: >-
            Digital visits convert at roughly half the store rate, and the gap widens on mobile.
      - id: express-format-tail
        description: >-
            Express-format locations carry the weakest conversion of the three formats.
      - id: dwell-without-purchase
        description: >-
            One category holds visitors longest and converts worst, which is the finding the
            funnel exists to surface.
  value_case:
    business_outcome: >-
      Trading and store operations can see the visits that bought nothing, which is where the
      recoverable sales are.
    baseline:
      method: "footfall counter export reconciled to POS in a spreadsheet, monthly"
      analyst_hours_month: 60
      captured: "2026-03"
    benefit_model: "recovered_visits * average_basket_value * gross_margin_rate"
    assumptions:
      - text: "share of abandoned baskets recoverable by an intervention"
        value: 6.5
        unit: percent
        sample_size: 240
        source: "abandonment pilot"
        dated: 2026-05-11
      - text: "average basket value on a recovered visit"
        value: 48.0
        unit: usd
        source: "POS FY26 actuals"
        dated: 2026-03-01
    attribution_confidence: medium
    review:
      last_reviewed: 2026-09-04
      reviewer: PTY-0040
