apiVersion: marketplace/v1
kind: DataProduct
metadata:
  id: DP-TRN-001
  name: "Fleet Movement & Delivery Performance"
  industry: transportation
  domain: operations
  archetype: consumer_aligned
  tier: tier1
  owner:
    party_id: PTY-0042
    team: "Fleet Operations"
    escalation: "#dp-fleet"
  certification: certified
spec:
  purpose: >-
    Shipment leg level view of movement, dwell, cost and delivery outcome across lanes and
    carriers for service and cost management.
  grain: "one row per shipment leg"
  history_months: 36
  known_limitations: >-
    Final mile performed by third party couriers is visible only at status message granularity.
    Driver identity is pseudonymised and may not be used for individual performance action.
  upstream_sources: [SRC-TMS, SRC-TELEMATICS, SRC-CARRIER-EDI]
  entities: [shipment, leg, carrier, facility]
  certified_kpis: [KPI-OTD-056, KPI-CPM-057, KPI-DWELL-058, KPI-ASSETUTIL-059, KPI-EXCRATE-060]
  columns:
    - name: shipment_leg_id
      type: string
      business_name: "Shipment Leg ID"
      nullable: false
      classification: [identifier]
      sensitivity: internal
      description: >-
        Identifier of the shipment leg.
    - name: shipment_id
      type: string
      business_name: "Shipment ID"
      nullable: false
      classification: [identifier]
      sensitivity: internal
      description: >-
        Parent shipment.
    - name: departure_timestamp
      type: timestamp
      business_name: "Departure Timestamp"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Time the leg departed origin.
    - name: lane
      type: string
      business_name: "Lane"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Origin to destination lane.
    - name: carrier
      type: string
      business_name: "Carrier"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Carrier executing the leg.
    - name: customer
      type: string
      business_name: "Customer"
      nullable: false
      classification: [identifier]
      sensitivity: confidential
      description: >-
        Customer the shipment is for.
    - name: service_level
      type: string
      business_name: "Service Level"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Committed service level for the shipment.
    - name: facility
      type: string
      business_name: "Facility"
      nullable: true
      classification: []
      sensitivity: internal
      description: >-
        Facility where dwell was recorded.
    - name: equipment_type
      type: string
      business_name: "Equipment Type"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Equipment class used on the leg.
    - name: region
      type: string
      business_name: "Region"
      nullable: false
      classification: [location]
      sensitivity: internal
      description: >-
        Operating region of the leg.
    - name: exception_type
      type: string
      business_name: "Exception Type"
      nullable: true
      classification: []
      sensitivity: internal
      description: >-
        Category of the logged exception, where one occurred.
    - name: delivery_attempted
      type: boolean
      business_name: "Delivery Attempted"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        True when a delivery was attempted on the leg.
    - name: delivered_within_window
      type: boolean
      business_name: "Delivered Within Window"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        True when delivery completed inside the committed appointment window.
    - name: exception_logged
      type: boolean
      business_name: "Exception Logged"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        True when an exception was recorded against the leg.
    - name: loaded_miles
      type: number
      business_name: "Loaded Miles"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Revenue miles travelled on the leg.
    - name: linehaul_cost
      type: number
      business_name: "Linehaul Cost"
      nullable: false
      classification: [financial]
      sensitivity: confidential
      description: >-
        Base transportation cost of the leg.
    - name: accessorial_cost
      type: number
      business_name: "Accessorial Cost"
      nullable: false
      classification: [financial]
      sensitivity: confidential
      description: >-
        Additional charges such as detention or fuel surcharge.
    - name: dwell_hours
      type: number
      business_name: "Dwell Hours"
      nullable: true
      classification: []
      sensitivity: internal
      description: >-
        Hours stationary at the facility between arrival and departure.
    - name: revenue_hours
      type: number
      business_name: "Revenue Hours"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Hours the asset spent earning revenue.
    - name: available_hours
      type: number
      business_name: "Available Hours"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Hours the asset was available for dispatch.
    - name: sla_penalty_risk
      type: boolean
      business_name: "SLA Penalty Risk"
      nullable: false
      classification: []
      sensitivity: confidential
      description: >-
        True when cumulative performance puts the customer contract at penalty risk.
  contract:
    version: 2.2.0
    schema_stability: additive_only
    guarantees:
      freshness:
        target: "every 30 minutes"
        p95_minutes: 8
        measured: per_partition
      availability:
        target_pct: 99.5
        window: monthly
      completeness:
        required_fields_pct: 99.5
      accuracy:
        reconciliation_variance_pct: 0.5
        against: "tms_system_of_record"
    deprecation_policy:
      notice_days: 60
      minimum_parallel_run_days: 30
    support:
      hours: "24x7"
      p1_response_minutes: 20
      on_call: "pagerduty://fleet-dp"
    classification:
      max_sensitivity: internal
      contains_pii: false
      residency: [US]
    consumer_obligations:
      - "No dispatch change may be executed from this product"
      - "Driver-level aggregates may not be used for individual performance action"
    breach_process: >-
      Auto-incident raised and affected consumers notified within 20 minutes of detection.
  quality_rules:
    - id: QR-TRN-001-01
      dimension: completeness
      column: shipment_leg_id
      rule: not_null
      threshold_pct: 100
      severity: critical
    - id: QR-TRN-001-02
      dimension: freshness
      rule: stream_lag_under
      target: "30m"
      tolerance_minutes: 8
      severity: critical
    - id: QR-TRN-001-03
      dimension: validity
      column: carrier
      rule: in_reference_set
      threshold_pct: 99.9
      severity: high
    - id: QR-TRN-001-04
      dimension: uniqueness
      columns: [shipment_leg_id]
      rule: unique_at_grain
      threshold_pct: 100
      severity: critical
    - id: QR-TRN-001-05
      dimension: consistency
      column: revenue_hours
      rule: not_greater_than_available
      threshold_pct: 100
      severity: high
  endpoints: [sql, mcp, stream]
  demo_tier:
    synthetic: true
    rows_target: 350000
    preserve: [distribution, seasonality, referential_integrity, cardinality]
    expected_quality: 86
    planted_patterns:
      - id: northeast-lane-lateness
        description: >-
            Lateness on Northeast lanes traces predominantly to dwell at two origin facilities rather
            than to transit time.
      - id: carrier-cost-spread
        description: >-
            Two carriers price materially differently on the same lanes with comparable service, which
            is the like-for-like finding.
  value_case:
    business_outcome: >-
      Operations sees which lanes and facilities are eroding service, and which customers are
      heading for penalty.
    baseline:
      method: "daily carrier scorecard assembled manually"
      analyst_hours_month: 95
      captured: "2026-02"
    benefit_model: "avoided_sla_penalties + detention_cost_reduction"
    assumptions:
      - text: "average monthly SLA penalty exposure per at-risk customer"
        value: 9400.0
        unit: usd
        source: "commercial FY26 contracts"
        dated: 2026-02-15
      - text: "achievable detention reduction from facility action"
        value: 11.0
        unit: percent
        sample_size: 180
        source: "facility pilot"
        dated: 2026-05-10
    attribution_confidence: medium
    review:
      last_reviewed: 2026-07-16
      reviewer: PTY-0042
