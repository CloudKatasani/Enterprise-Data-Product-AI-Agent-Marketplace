apiVersion: marketplace/v1
kind: DataProduct
metadata:
  id: DP-TEL-002
  name: "Network Experience & Fault Signal"
  industry: telecommunications
  domain: network_asset
  archetype: aggregate
  tier: tier1
  owner:
    party_id: PTY-0032
    team: "Telecom Network Domain"
    escalation: "#dp-network"
  certification: certified
spec:
  purpose: >-
    Site-level network availability, quality and fault signal joined to the subscribers each
    site serves.
  grain: "one row per site per hour"
  history_months: 13
  known_limitations: >-
    Small cells and distributed antenna systems are aggregated to their parent macro site.
    Impacted subscriber counts are modelled from the serving relationship, not measured per
    subscriber.
  upstream_sources: [SRC-NETWORK-OSS, SRC-NETWORK-USAGE, SRC-FIELD-WORK]
  entities: [site, cell, fault, region]
  certified_kpis: [KPI-NETAVAIL-006, KPI-DROP-007, KPI-THRPUT-008, KPI-FMTTR-009, KPI-IMPHRS-010]
  columns:
    - name: site_id
      type: string
      business_name: "Site ID"
      nullable: false
      classification: [identifier]
      sensitivity: internal
      description: >-
        Identifier of the macro site.
    - name: observed_hour
      type: timestamp
      business_name: "Observed Hour"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Hour the measurements describe, in UTC.
    - name: region
      type: string
      business_name: "Region"
      nullable: false
      classification: [location]
      sensitivity: internal
      description: >-
        Network region the site belongs to.
    - name: site_class
      type: string
      business_name: "Site Class"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Urban, suburban or rural classification driving expected load.
    - name: technology
      type: string
      business_name: "Technology"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Predominant radio technology carrying traffic at the site.
    - name: available_minutes
      type: integer
      business_name: "Available Minutes"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Minutes in the hour the site carried traffic.
    - name: scheduled_minutes
      type: integer
      business_name: "Scheduled Minutes"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Minutes in the hour the site was expected to be in service.
    - name: established_calls
      type: integer
      business_name: "Established Calls"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Voice calls successfully established in the hour.
    - name: dropped_calls
      type: integer
      business_name: "Dropped Calls"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Voice calls terminated abnormally by the network.
    - name: throughput_mbps
      type: number
      business_name: "Throughput Mbps"
      nullable: true
      classification: []
      sensitivity: internal
      description: >-
        User-plane throughput sample in megabits per second.
    - name: fault_class
      type: string
      business_name: "Fault Class"
      nullable: true
      classification: []
      sensitivity: internal
      description: >-
        Category of the dominant open fault at the site.
    - name: fault_closed
      type: boolean
      business_name: "Fault Closed in Hour"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        True when a fault at this site was closed within the hour.
    - name: restore_minutes
      type: integer
      business_name: "Restore Minutes"
      nullable: true
      classification: []
      sensitivity: internal
      description: >-
        Elapsed minutes from fault detection to restoration.
    - name: impacted_subscribers
      type: integer
      business_name: "Impacted Subscribers"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Modelled count of subscribers served by the site during a degradation.
    - name: outage_hours
      type: number
      business_name: "Outage Hours"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Fraction of the hour the site was degraded or out of service.
    - name: impacted_subscriber_hours
      type: number
      business_name: "Impacted Subscriber Hours"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Impacted subscribers multiplied by outage hours.
  contract:
    version: 2.4.0
    schema_stability: additive_only
    guarantees:
      freshness:
        target: "hourly, 12 minutes past"
        p95_minutes: 12
        measured: per_partition
      availability:
        target_pct: 99.0
        window: monthly
      completeness:
        required_fields_pct: 99.5
      accuracy:
        reconciliation_variance_pct: 1.0
        against: "network_oss_system_of_record"
    deprecation_policy:
      notice_days: 60
      minimum_parallel_run_days: 21
    support:
      hours: "24x7"
      p1_response_minutes: 15
      on_call: "pagerduty://network-dp"
    classification:
      max_sensitivity: internal
      contains_pii: false
      residency: [US]
    consumer_obligations:
      - "Impacted subscriber counts are modelled and must be described as such"
    breach_process: >-
      Auto-incident raised and affected consumers notified within 15 minutes of detection.
  quality_rules:
    - id: QR-TEL-002-01
      dimension: completeness
      column: site_id
      rule: not_null
      threshold_pct: 100
      severity: critical
    - id: QR-TEL-002-02
      dimension: freshness
      rule: partition_completion_by
      target: "hourly+12m"
      tolerance_minutes: 12
      severity: critical
    - id: QR-TEL-002-03
      dimension: validity
      column: technology
      rule: in_reference_set
      threshold_pct: 99.9
      severity: high
    - id: QR-TEL-002-04
      dimension: uniqueness
      columns: [site_id, observed_hour]
      rule: unique_at_grain
      threshold_pct: 99.99
      severity: critical
    - id: QR-TEL-002-05
      dimension: consistency
      column: available_minutes
      rule: not_greater_than_scheduled
      threshold_pct: 100
      severity: high
  endpoints: [sql, mcp, stream]
  demo_tier:
    synthetic: true
    rows_target: 400000
    preserve: [distribution, seasonality, referential_integrity, cardinality]
    planted_patterns:
      - id: denver-throughput-drop
        description: >-
            A sustained throughput drop in the Denver cluster traces to two sites whose backhaul was
            reconfigured, visible only when throughput is segmented by site class.
      - id: recurring-faults
        description: >-
            A small set of assets carries repeat faults of the same class, which is what makes the
            pattern-detection question answerable.
  value_case:
    business_outcome: >-
      Network and care teams agree on which sites are hurting customers, and in what order to fix
      them.
    baseline:
      method: "weekly spreadsheet consolidation across three tools"
      analyst_hours_month: 80
      captured: "2026-01"
    benefit_model: "avoided_truck_rolls * cost_per_dispatch + reduced_care_contacts * cost_per_contact"
    assumptions:
      - text: "fully loaded cost per field dispatch"
        value: 310.0
        unit: usd
        source: "field operations FY26 budget"
        dated: 2026-02-01
      - text: "cost per avoided care contact"
        value: 7.4
        unit: usd
        source: "care operations model"
        dated: 2026-02-01
    attribution_confidence: medium
    review:
      last_reviewed: 2026-07-02
      reviewer: PTY-0032
