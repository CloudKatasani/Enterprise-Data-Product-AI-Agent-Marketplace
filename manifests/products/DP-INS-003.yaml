apiVersion: marketplace/v1
kind: DataProduct
metadata:
  id: DP-INS-003
  name: "Policyholder & Distribution 360"
  industry: insurance
  domain: customer
  archetype: aggregate
  tier: tier1
  owner:
    party_id: PTY-0036
    team: "Customer & Distribution Analytics"
    escalation: "#dp-policyholder"
  certification: certified
spec:
  purpose: >-
    Customer-level view of holdings, servicing behaviour and distribution relationship, so
    penetration, digital adoption and complaint load are read on the customer rather than on the
    policy.
  grain: "one row per customer per month"
  history_months: 36
  known_limitations: >-
    Customers are resolved across coverage lines by a deterministic match on name, date of birth
    and address; households with shared details can merge, and a customer who moves without
    notifying can split. Agency attribution is to the producer of record at the position date,
    not to whoever originally sold the policy. Survey responses are voluntary and skew to the
    engaged, so they describe respondents rather than the book.
  upstream_sources: [SRC-POLICY-ADMIN, SRC-AGENCY-PORTAL, SRC-CRM, SRC-VOC-SURVEY]
  entities: [customer, household, policy, agency]
  certified_kpis: [KPI-POLPERCUST-103, KPI-MULTILINE-104, KPI-DIGITAL-105, KPI-XSELL-106, KPI-COMPLAINT-107]
  columns:
    - name: customer_id
      type: string
      business_name: "Customer ID"
      nullable: false
      classification: [identifier, pii]
      sensitivity: restricted
      description: >-
        Pseudonymous policyholder. The grain of this product together with the position month.
    - name: household_id
      type: string
      business_name: "Household ID"
      nullable: true
      classification: [identifier, pii]
      sensitivity: restricted
      description: >-
        Resolved household, null where the customer could not be matched to one.
    - name: as_of_month
      type: date
      business_name: "Position Month"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        First day of the month the position describes.
    - name: segment
      type: string
      business_name: "Segment"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Customer segment the relationship is managed within.
    - name: region
      type: string
      business_name: "Region"
      nullable: false
      classification: [location]
      sensitivity: internal
      description: >-
        Region of the customer's mailing address.
    - name: distribution_channel
      type: string
      business_name: "Distribution Channel"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Channel the relationship is serviced through.
    - name: agency_id
      type: string
      business_name: "Agency"
      nullable: true
      classification: [identifier]
      sensitivity: confidential
      description: >-
        Producer of record at the position date, null for direct relationships.
    - name: tenure_band
      type: string
      business_name: "Tenure Band"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        How long the customer has held any policy, banded.
    - name: policies_held
      type: number
      business_name: "Policies Held"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        In-force policies at the position date.
    - name: coverage_lines_held
      type: number
      business_name: "Coverage Lines Held"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Distinct coverage lines the customer holds at the position date.
    - name: total_written_premium
      type: number
      business_name: "Total Written Premium"
      nullable: false
      classification: [financial]
      sensitivity: confidential
      description: >-
        Premium written across the customer's in-force policies.
    - name: service_contacts_90d
      type: integer
      business_name: "Service Contacts (90d)"
      nullable: false
      classification: [behavioural]
      sensitivity: internal
      description: >-
        Servicing interactions in the trailing ninety days.
    - name: complaints_90d
      type: integer
      business_name: "Complaints (90d)"
      nullable: false
      classification: [behavioural]
      sensitivity: confidential
      description: >-
        Complaints raised in the trailing ninety days.
    - name: nps_response
      type: integer
      business_name: "NPS Response"
      nullable: true
      classification: [behavioural]
      sensitivity: internal
      description: >-
        Most recent survey score, null where the customer has never responded.
    - name: digital_registered
      type: boolean
      business_name: "Digitally Registered"
      nullable: false
      classification: [behavioural]
      sensitivity: internal
      description: >-
        True when the customer holds an active digital servicing account.
    - name: autopay_enrolled
      type: boolean
      business_name: "Autopay Enrolled"
      nullable: false
      classification: [financial]
      sensitivity: internal
      description: >-
        True when premium is collected automatically.
    - name: cross_sell_eligible
      type: boolean
      business_name: "Cross-Sell Eligible"
      nullable: false
      classification: [behavioural]
      sensitivity: internal
      description: >-
        True when the customer met the eligibility rules for a cross-sell in the month.
    - name: cross_sell_accepted
      type: boolean
      business_name: "Cross-Sell Accepted"
      nullable: false
      classification: [behavioural]
      sensitivity: internal
      description: >-
        True when an offered cross-sell was taken up in the month.
    - name: multi_line
      type: boolean
      business_name: "Multi-Line"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        True when the customer holds policies across more than one coverage line.
    - name: lapsed
      type: boolean
      business_name: "Lapsed"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        True when every policy the customer held lapsed during the month.
  contract:
    version: 1.0.0
    schema_stability: additive_only
    guarantees:
      freshness:
        target: "monthly by the third working day"
        p95_minutes: 180
        measured: per_partition
      availability:
        target_pct: 99.5
        window: monthly
      completeness:
        required_fields_pct: 99.5
      accuracy:
        reconciliation_variance_pct: 0.5
        against: "policy_administration_system"
    deprecation_policy:
      notice_days: 120
      minimum_parallel_run_days: 60
    support:
      hours: "business"
      p1_response_minutes: 45
      on_call: "pagerduty://policyholder-dp"
    classification:
      max_sensitivity: restricted
      contains_pii: true
      residency: [US, EU]
    consumer_obligations:
      - "Customer resolution is probabilistic and must not be used to deny a claim or a renewal"
      - "Survey scores describe respondents and must not be reported as book-wide sentiment"
    breach_process: >-
      Auto-incident raised and affected consumers notified within 45 minutes of detection.
  quality_rules:
    - id: QR-INS-003-01
      dimension: completeness
      column: customer_id
      rule: not_null
      threshold_pct: 100
      severity: critical
    - id: QR-INS-003-02
      dimension: uniqueness
      columns: [customer_id, as_of_month]
      rule: unique_at_grain
      threshold_pct: 99.99
      severity: critical
    - id: QR-INS-003-03
      dimension: freshness
      rule: partition_completion_by
      target: "30d"
      tolerance_minutes: 180
      severity: critical
    - id: QR-INS-003-04
      dimension: validity
      column: distribution_channel
      rule: in_reference_set
      threshold_pct: 99.9
      severity: high
    - id: QR-INS-003-05
      dimension: consistency
      column: policies_held
      rule: non_negative
      threshold_pct: 100
      severity: high
  endpoints: [sql, mcp]
  demo_tier:
    synthetic: true
    rows_target: 980000
    preserve: [distribution, seasonality, referential_integrity, cardinality]
    expected_quality: 88
    planted_patterns:
      - id: agency-multiline-gap
        description: >-
            One distribution channel carries materially lower multi-line penetration than the
            rest of the book.
      - id: digital-tenure-skew
        description: >-
            Digital enrolment falls away sharply in the longest tenure band.
      - id: complaint-concentration
        description: >-
            Complaints concentrate in one region and one segment together, not in either alone.
  value_case:
    business_outcome: >-
      Distribution decides where to put a cross-sell campaign from penetration, not from
      whichever agency shouts loudest.
    baseline:
      method: "quarterly distribution pack assembled from policy extracts by channel"
      analyst_hours_month: 110
      captured: "2026-02"
    benefit_model: "incremental_multi_line_customers * multi_line_retention_uplift * margin"
    assumptions:
      - text: "retention uplift observed on multi-line customers over single-line"
        value: 9.0
        unit: percent
        sample_size: 4100
        source: "retention cohort study"
        dated: 2026-04-18
      - text: "annual margin per retained customer"
        value: 210.0
        unit: usd
        source: "FY26 customer profitability model"
        dated: 2026-01-30
    attribution_confidence: medium
    review:
      last_reviewed: 2026-09-04
      reviewer: PTY-0036
