apiVersion: marketplace/v1
kind: DataProduct
metadata:
  id: DP-TCH-001
  name: "Product Usage & Feature Adoption"
  industry: technology
  domain: product
  archetype: consumer_aligned
  tier: tier1
  owner:
    party_id: PTY-0033
    team: "Product Analytics"
    escalation: "#dp-product"
  certification: certified
spec:
  purpose: >-
    Account and feature level usage, activation and adoption joined to entitlement and plan
    state for product and renewal decisions.
  grain: "one row per account per feature per day"
  history_months: 24
  known_limitations: >-
    Anonymous pre-signup activity is out of scope. Feature events emitted by clients older than
    two major versions are not instrumented and are excluded rather than estimated.
  upstream_sources: [SRC-PRODUCT-EVENTS, SRC-CRM, SRC-ENTITLEMENTS]
  entities: [account, user, feature, plan]
  certified_kpis: [KPI-DAUMAU-011, KPI-FEATADP-012, KPI-ACTIV-013, KPI-TTV-014, KPI-NRR-015]
  columns:
    - name: account_id
      type: string
      business_name: "Account ID"
      nullable: false
      classification: [identifier]
      sensitivity: internal
      description: >-
        Commercial account the activity belongs to.
    - name: feature
      type: string
      business_name: "Feature"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Instrumented product feature.
    - name: activity_date
      type: date
      business_name: "Activity Date"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Calendar date the row describes, in UTC.
    - name: plan_tier
      type: string
      business_name: "Plan Tier"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Commercial plan tier in force on the date.
    - name: segment
      type: string
      business_name: "Segment"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Go-to-market segment assigned to the account.
    - name: region
      type: string
      business_name: "Region"
      nullable: false
      classification: [location]
      sensitivity: internal
      description: >-
        Billing region of the account.
    - name: acquisition_channel
      type: string
      business_name: "Acquisition Channel"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Channel the account was acquired through.
    - name: feature_entitled
      type: boolean
      business_name: "Feature Entitled"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        True when the account's plan entitles it to the feature.
    - name: feature_used
      type: boolean
      business_name: "Feature Used"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        True when the feature was used at least once on the date.
    - name: daily_active_account
      type: string
      business_name: "Daily Active Account"
      nullable: true
      classification: [identifier]
      sensitivity: internal
      description: >-
        Account identifier when the account was active on the date, otherwise null.
    - name: monthly_active_account
      type: string
      business_name: "Monthly Active Account"
      nullable: true
      classification: [identifier]
      sensitivity: internal
      description: >-
        Account identifier when the account was active in the trailing 30 days.
    - name: onboarded
      type: boolean
      business_name: "Onboarded"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        True when the account completed onboarding on or before the date.
    - name: activated
      type: boolean
      business_name: "Activated"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        True when the account reached the defined activation milestone.
    - name: days_to_first_value
      type: integer
      business_name: "Days to First Value"
      nullable: true
      classification: []
      sensitivity: internal
      description: >-
        Days between account creation and the first value milestone.
    - name: starting_recurring_revenue
      type: number
      business_name: "Starting Recurring Revenue"
      nullable: true
      classification: [financial]
      sensitivity: confidential
      description: >-
        Recurring revenue at the start of the measurement period.
    - name: ending_recurring_revenue
      type: number
      business_name: "Ending Recurring Revenue"
      nullable: true
      classification: [financial]
      sensitivity: confidential
      description: >-
        Recurring revenue at the end of the measurement period.
    - name: renewal_date
      type: date
      business_name: "Renewal Date"
      nullable: true
      classification: []
      sensitivity: internal
      description: >-
        Next contractual renewal date for the account.
  contract:
    version: 4.1.0
    schema_stability: additive_only
    guarantees:
      freshness:
        target: "hourly, 20 minutes past"
        p95_minutes: 20
        measured: per_partition
      availability:
        target_pct: 99.5
        window: monthly
      completeness:
        required_fields_pct: 99.5
      accuracy:
        reconciliation_variance_pct: 0.5
        against: "billing_system_of_record"
    deprecation_policy:
      notice_days: 60
      minimum_parallel_run_days: 30
    support:
      hours: "24x5"
      p1_response_minutes: 30
      on_call: "pagerduty://product-dp"
    classification:
      max_sensitivity: confidential
      contains_pii: false
      residency: [US, EU]
    consumer_obligations:
      - "Individual user behaviour may only be analysed with a recorded consent basis"
      - "Revenue columns may not be redistributed outside finance-approved purposes"
    breach_process: >-
      Auto-incident raised and affected consumers notified within 30 minutes of detection.
  quality_rules:
    - id: QR-TCH-001-01
      dimension: completeness
      column: account_id
      rule: not_null
      threshold_pct: 100
      severity: critical
    - id: QR-TCH-001-02
      dimension: freshness
      rule: partition_completion_by
      target: "hourly+20m"
      tolerance_minutes: 20
      severity: high
    - id: QR-TCH-001-03
      dimension: validity
      column: plan_tier
      rule: in_reference_set
      threshold_pct: 99.9
      severity: high
    - id: QR-TCH-001-04
      dimension: uniqueness
      columns: [account_id, feature, activity_date]
      rule: unique_at_grain
      threshold_pct: 99.99
      severity: critical
    - id: QR-TCH-001-05
      dimension: consistency
      column: feature_used
      rule: implies_entitled_or_trial
      threshold_pct: 99.0
      severity: medium
  endpoints: [sql, rest, mcp]
  demo_tier:
    synthetic: true
    rows_target: 600000
    preserve: [distribution, seasonality, referential_integrity, cardinality]
    planted_patterns:
      - id: activation-driver
        description: >-
            Two features account for most of the activation lift in the quarter, and the effect is
            visible only when activation is segmented by acquisition channel.
      - id: entitlement-gap
        description: >-
            A set of features shows high usage among accounts on tiers that do not entitle them, which
            is the gap-analysis finding.
  value_case:
    business_outcome: >-
      Product and renewal teams see which features move activation and which accounts are drifting
      before renewal.
    baseline:
      method: "quarterly manual cohort pull by the product analytics team"
      analyst_hours_month: 90
      captured: "2026-01"
    benefit_model: "renewal_risk_identified_early * average_contract_value * intervention_success_rate"
    assumptions:
      - text: "average annual contract value"
        value: 28400.0
        unit: usd
        source: "finance FY26 model"
        dated: 2026-02-01
      - text: "intervention success rate on flagged accounts"
        value: 18.0
        unit: percent
        sample_size: 210
        source: "customer success study"
        dated: 2026-05-20
    attribution_confidence: medium
    review:
      last_reviewed: 2026-06-30
      reviewer: PTY-0033
