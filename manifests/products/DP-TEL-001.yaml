apiVersion: marketplace/v1
kind: DataProduct
metadata:
  id: DP-TEL-001
  name: "Subscriber Churn & Retention 360"
  industry: telecommunications
  domain: customer
  archetype: consumer_aligned
  tier: tier1
  owner:
    party_id: PTY-0031
    team: "Telecom Customer Domain"
    escalation: "#dp-telecom"
  certification: certified
spec:
  purpose: >-
    Unified view of subscriber state, tenure, plan, usage, service events and churn outcome for
    retention decisioning.
  grain: "one row per subscriber per day"
  history_months: 36
  known_limitations: >-
    Prepaid subscribers are excluded. Service events are joined on a four-hour lag. Churn
    outcome is final only after the 30-day reconnection window closes.
  upstream_sources: [SRC-BILLING, SRC-CRM, SRC-NETWORK-USAGE, SRC-CARE-TICKETS]
  entities: [subscriber, account, plan, site]
  certified_kpis: [KPI-CHURN-001, KPI-RETEN-002, KPI-SAVE-003, KPI-TENURE-004, KPI-PROP-005]
  columns:
    - name: subscriber_id
      type: string
      business_name: "Subscriber ID"
      nullable: false
      classification: [pii, identifier]
      sensitivity: confidential
      description: >-
        Stable pseudonymous identifier for a subscriber line.
    - name: account_id
      type: string
      business_name: "Account ID"
      nullable: false
      classification: [pii, identifier]
      sensitivity: confidential
      description: >-
        Billing account the subscriber line belongs to.
    - name: activity_date
      type: date
      business_name: "Activity Date"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Calendar date the row describes, in the network's local time zone.
    - name: segment
      type: string
      business_name: "Segment"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Commercial segment assigned by the customer domain.
    - name: region
      type: string
      business_name: "Region"
      nullable: false
      classification: [location]
      sensitivity: internal
      description: >-
        Marketing region derived from the service address.
    - name: plan_type
      type: string
      business_name: "Plan Type"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Commercial plan family the subscriber is on.
    - name: tenure_days
      type: integer
      business_name: "Tenure in Days"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Days since the line was first activated.
    - name: tenure_band
      type: string
      business_name: "Tenure Band"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Banded tenure used for cohort reporting.
    - name: channel
      type: string
      business_name: "Acquisition Channel"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Channel through which the line was originally acquired.
    - name: active_at_period_start
      type: boolean
      business_name: "Active at Period Start"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        True when the line was in service at the start of the reporting period.
    - name: churn_flag
      type: boolean
      business_name: "Churned in Period"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        True when the subscriber disconnected within the period and did not reconnect.
    - name: churn_reason_code
      type: string
      business_name: "Churn Reason Code"
      nullable: true
      classification: []
      sensitivity: internal
      description: >-
        Disconnect reason captured at the point of cancellation.
    - name: save_offer_made
      type: boolean
      business_name: "Save Offer Made"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        True when a retention offer was presented during the period.
    - name: save_offer_accepted
      type: boolean
      business_name: "Save Offer Accepted"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        True when a presented retention offer was accepted.
    - name: churn_propensity_score
      type: number
      business_name: "Churn Propensity Score"
      nullable: true
      classification: [behavioural]
      sensitivity: confidential
      description: >-
        Modelled probability of disconnect in the next 30 days.
    - name: propensity_decile
      type: integer
      business_name: "Propensity Decile"
      nullable: true
      classification: [behavioural]
      sensitivity: confidential
      description: >-
        Decile rank of the propensity score, one being highest risk.
    - name: ltv
      type: number
      business_name: "Lifetime Value"
      nullable: true
      classification: [financial]
      sensitivity: confidential
      description: >-
        Modelled remaining contribution margin for the line.
    - name: contract_end_date
      type: date
      business_name: "Contract End Date"
      nullable: true
      classification: []
      sensitivity: internal
      description: >-
        Date the current minimum term ends, null for out-of-contract lines.
    - name: care_contacts_30d
      type: integer
      business_name: "Care Contacts in 30 Days"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Count of care interactions in the trailing 30 days.
    - name: network_incidents_30d
      type: integer
      business_name: "Network Incidents in 30 Days"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Count of network faults affecting the line in the trailing 30 days.
  contract:
    version: 3.2.0
    schema_stability: additive_only
    guarantees:
      freshness:
        target: "06:00 local"
        p95_minutes: 45
        measured: per_partition
      availability:
        target_pct: 99.5
        window: monthly
      completeness:
        required_fields_pct: 99.9
      accuracy:
        reconciliation_variance_pct: 0.5
        against: "billing_system_of_record"
    deprecation_policy:
      notice_days: 90
      minimum_parallel_run_days: 30
    support:
      hours: "24x5"
      p1_response_minutes: 30
      on_call: "pagerduty://telecom-dp"
    classification:
      max_sensitivity: confidential
      contains_pii: true
      residency: [US, EU]
    consumer_obligations:
      - "No redistribution outside the granted purpose"
      - "Re-derived KPIs must cite the certified definition ID"
      - "Propensity scores may not be used for individual credit decisions"
    breach_process: >-
      Auto-incident raised and affected consumers notified within 30 minutes of detection.
  quality_rules:
    - id: QR-TEL-001-01
      dimension: completeness
      column: subscriber_id
      rule: not_null
      threshold_pct: 100
      severity: critical
    - id: QR-TEL-001-02
      dimension: uniqueness
      columns: [subscriber_id, activity_date]
      rule: unique_at_grain
      threshold_pct: 99.99
      severity: critical
    - id: QR-TEL-001-03
      dimension: freshness
      rule: partition_completion_by
      target: "06:00"
      tolerance_minutes: 45
      severity: high
    - id: QR-TEL-001-04
      dimension: validity
      column: segment
      rule: in_reference_set
      threshold_pct: 99.5
      severity: high
    - id: QR-TEL-001-05
      dimension: accuracy
      column: ltv
      rule: reconcile_to_source
      threshold_pct: 99.5
      severity: medium
    - id: QR-TEL-001-06
      dimension: consistency
      column: churn_flag
      rule: agrees_with_billing_status
      threshold_pct: 99.0
      severity: high
  endpoints: [sql, rest, mcp]
  demo_tier:
    synthetic: true
    rows_target: 250000
    preserve: [distribution, seasonality, referential_integrity, cardinality]
    planted_patterns:
      - id: churn-concentration-tenure
        description: >-
            A genuine churn concentration sits in the 13 to 24 month tenure band in the Midwest region,
            driven by contract expiry clustering.
      - id: network-churn-correlation
        description: >-
            Subscribers with three or more network incidents in 30 days churn at roughly twice the base
            rate, concentrated in two Midwest markets.
  value_case:
    business_outcome: >-
      Retention teams target save offers at subscribers genuinely at risk instead of by tenure
      band.
    baseline:
      method: "tenure-band targeting"
      analyst_hours_month: 120
      captured: "2026-02"
    benefit_model: "save_offer_precision_uplift * contribution_margin_per_retained - offer_cost"
    assumptions:
      - text: "contribution margin per retained subscriber"
        value: 41.2
        unit: usd
        source: "finance FY26 model"
        dated: 2026-03-01
      - text: "incremental save rate from propensity targeting"
        value: 6.5
        unit: percent
        sample_size: 1200
        source: "2026 holdout test"
        dated: 2026-04-15
    attribution_confidence: medium
    review:
      last_reviewed: 2026-07-14
      reviewer: PTY-0031
