apiVersion: marketplace/v1
kind: DataProduct
metadata:
  id: DP-TRN-002
  name: "Freight Cost & Margin"
  industry: transportation
  domain: finance
  archetype: consumer_aligned
  tier: tier1
  owner:
    party_id: PTY-0052
    team: "Logistics Finance"
    escalation: "#dp-freight-cost"
  certification: certified
spec:
  purpose: >-
    Invoice-line economics for every freight movement — revenue billed against linehaul,
    accessorial and fuel cost — so lane margin is read from what was invoiced rather than from
    what was planned.
  grain: "one row per carrier invoice line"
  history_months: 24
  known_limitations: >-
    A line appears when the carrier invoices, not when the shipment moves, so a lane's margin
    for a period settles over the following six to eight weeks and early periods restate.
    Disputed amounts are the amount raised, not the amount eventually recovered. Fuel surcharge
    follows the published index with a one-week lag by contract, which is a real cost timing
    difference rather than a data one.
  upstream_sources: [SRC-FREIGHT-AUDIT, SRC-RATE-MGMT, SRC-TMS, SRC-CARRIER-EDI]
  entities: [invoice_line, shipment, carrier, lane, customer]
  certified_kpis: [KPI-FRTMARGIN-088, KPI-COSTPERKM-089, KPI-ACCESSSHARE-090, KPI-SPOTEXP-091, KPI-DISPUTE-092]
  columns:
    - name: invoice_line_id
      type: string
      business_name: "Invoice Line ID"
      nullable: false
      classification: [identifier]
      sensitivity: internal
      description: >-
        Carrier invoice line. The grain of this product.
    - name: shipment_id
      type: string
      business_name: "Shipment ID"
      nullable: false
      classification: [identifier]
      sensitivity: internal
      description: >-
        Shipment the line bills for.
    - name: invoice_date
      type: date
      business_name: "Invoice Date"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Date the carrier raised the invoice.
    - name: lane
      type: string
      business_name: "Lane"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Origin and destination pair the movement ran on.
    - name: carrier
      type: string
      business_name: "Carrier"
      nullable: false
      classification: []
      sensitivity: confidential
      description: >-
        Carrier that moved the freight and raised the invoice.
    - name: customer
      type: string
      business_name: "Customer"
      nullable: false
      classification: []
      sensitivity: confidential
      description: >-
        Shipper the movement was performed for.
    - name: service_level
      type: string
      business_name: "Service Level"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Service commitment the movement was tendered under.
    - name: mode
      type: string
      business_name: "Mode"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Transport mode the movement used.
    - name: equipment_type
      type: string
      business_name: "Equipment Type"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Equipment the freight moved in.
    - name: region
      type: string
      business_name: "Region"
      nullable: false
      classification: [location]
      sensitivity: internal
      description: >-
        Region the lane originates in.
    - name: accessorial_type
      type: string
      business_name: "Accessorial Type"
      nullable: true
      classification: []
      sensitivity: internal
      description: >-
        Category of the accessorial charged on the line, null where none was.
    - name: billed_revenue
      type: number
      business_name: "Billed Revenue"
      nullable: false
      classification: [financial]
      sensitivity: confidential
      description: >-
        Revenue billed to the shipper for the movement.
    - name: linehaul_cost
      type: number
      business_name: "Linehaul Cost"
      nullable: false
      classification: [financial]
      sensitivity: confidential
      description: >-
        Contracted or spot cost of moving the freight.
    - name: accessorial_cost
      type: number
      business_name: "Accessorial Cost"
      nullable: false
      classification: [financial]
      sensitivity: confidential
      description: >-
        Detention, layover, redelivery and other charges beyond linehaul.
    - name: fuel_surcharge
      type: number
      business_name: "Fuel Surcharge"
      nullable: false
      classification: [financial]
      sensitivity: confidential
      description: >-
        Fuel surcharge applied under the published index.
    - name: contracted_rate
      type: number
      business_name: "Contracted Rate"
      nullable: true
      classification: [financial]
      sensitivity: confidential
      description: >-
        Rate the lane was contracted at, null where the move was tendered to spot.
    - name: spot_rate
      type: number
      business_name: "Spot Rate"
      nullable: true
      classification: [financial]
      sensitivity: confidential
      description: >-
        Rate accepted on the spot market, null where the move ran on contract.
    - name: tendered_to_spot
      type: boolean
      business_name: "Tendered to Spot"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        True when the movement went to the spot market rather than a contracted carrier.
    - name: invoice_disputed
      type: boolean
      business_name: "Invoice Disputed"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        True when the line was raised as an audit exception.
    - name: disputed_amount
      type: number
      business_name: "Disputed Amount"
      nullable: false
      classification: [financial]
      sensitivity: confidential
      description: >-
        Amount raised in dispute on the line, zero where none.
    - name: weight_kg
      type: number
      business_name: "Weight"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Billable weight of the movement in kilograms.
    - name: billable_km
      type: number
      business_name: "Billable Kilometres"
      nullable: false
      classification: []
      sensitivity: internal
      description: >-
        Distance the movement was billed for.
  contract:
    version: 1.0.0
    schema_stability: additive_only
    guarantees:
      freshness:
        target: "daily by 06:00"
        p95_minutes: 90
        measured: per_partition
      availability:
        target_pct: 99.5
        window: monthly
      completeness:
        required_fields_pct: 99.5
      accuracy:
        reconciliation_variance_pct: 0.25
        against: "accounts_payable_ledger"
    deprecation_policy:
      notice_days: 90
      minimum_parallel_run_days: 45
    support:
      hours: "business"
      p1_response_minutes: 45
      on_call: "pagerduty://freight-cost-dp"
    classification:
      max_sensitivity: confidential
      contains_pii: false
      residency: [US, EU]
    consumer_obligations:
      - "Carrier-level rates are commercially confidential and must not leave procurement"
      - "Recent periods are unsettled and must be labelled as such when reported"
    breach_process: >-
      Auto-incident raised and affected consumers notified within 45 minutes of detection.
  quality_rules:
    - id: QR-TRN-002-01
      dimension: completeness
      column: invoice_line_id
      rule: not_null
      threshold_pct: 100
      severity: critical
    - id: QR-TRN-002-02
      dimension: uniqueness
      columns: [invoice_line_id]
      rule: unique_at_grain
      threshold_pct: 99.99
      severity: critical
    - id: QR-TRN-002-03
      dimension: freshness
      rule: partition_completion_by
      target: "24h"
      tolerance_minutes: 90
      severity: critical
    - id: QR-TRN-002-04
      dimension: validity
      column: mode
      rule: in_reference_set
      threshold_pct: 99.9
      severity: high
    - id: QR-TRN-002-05
      dimension: consistency
      column: billed_revenue
      rule: non_negative
      threshold_pct: 100
      severity: high
    - id: QR-TRN-002-06
      dimension: accuracy
      column: linehaul_cost
      rule: reconciles_to_source
      threshold_pct: 99.75
      severity: critical
  endpoints: [sql, mcp]
  demo_tier:
    synthetic: true
    rows_target: 860000
    preserve: [distribution, seasonality, referential_integrity, cardinality]
    expected_quality: 90
    planted_patterns:
      - id: accessorial-lane-concentration
        description: >-
            Accessorial spend concentrates on a small number of lanes, driven by detention.
      - id: spot-margin-erosion
        description: >-
            Spot-tendered movements carry a materially thinner margin than contracted ones.
      - id: one-carrier-disputes
        description: >-
            One carrier accounts for a disproportionate share of disputed value.
  value_case:
    business_outcome: >-
      Procurement renegotiates the lanes that actually lose money rather than the ones with the
      largest spend.
    baseline:
      method: "quarterly lane review from carrier invoices exported into a spreadsheet"
      analyst_hours_month: 120
      captured: "2026-03"
    benefit_model: "addressable_accessorial_spend * negotiated_reduction_rate"
    assumptions:
      - text: "share of accessorial spend addressable by lane renegotiation"
        value: 28.0
        unit: percent
        sample_size: 65
        source: "carrier negotiation outcomes FY25"
        dated: 2026-03-10
      - text: "reduction achieved on addressable accessorial spend"
        value: 18.0
        unit: percent
        sample_size: 22
        source: "procurement post-negotiation review"
        dated: 2026-03-10
    attribution_confidence: medium
    review:
      last_reviewed: 2026-09-04
      reviewer: PTY-0052
