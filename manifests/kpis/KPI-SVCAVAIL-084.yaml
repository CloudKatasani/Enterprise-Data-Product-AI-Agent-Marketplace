apiVersion: marketplace/v1
kind: Kpi
metadata:
  id: KPI-SVCAVAIL-084
  name: "Service Availability"
  domain: operations
  steward: PTY-0033
  status: certified
spec:
  business_definition: >-
    Minutes a service was available over minutes it was scheduled to be. Scheduled maintenance
    is removed from both halves, so a planned window is not counted as downtime.
  numerator_expr: "sum(availability_minutes)"
  denominator_expr: "sum(scheduled_minutes)"
  grains_supported: [day, week, month]
  slices_supported: [service_tier, region, team, deployment_ring]
  unit: percent
  direction: higher_is_better
  target: 99.9
  source_of_record: DP-TCH-002
  forum_approved_at: 2026-09-04
  last_reviewed: 2026-09-04
  review_months: 12
  synonyms: ["uptime", "availability"]
