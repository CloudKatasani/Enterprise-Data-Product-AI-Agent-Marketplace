apiVersion: marketplace/v1
kind: Kpi
metadata:
  id: KPI-MTTREPAIR-109
  name: "Mean Time to Repair"
  domain: network_asset
  steward: PTY-0053
  status: certified
spec:
  business_definition: >-
    Wrench time from a failure being raised to the equipment running again. Repair, not
    response: the clock stops when the line moves.
  numerator_expr: "sum(repair_minutes)"
  denominator_expr: "count(distinct failure_id)"
  grains_supported: [month, quarter, year]
  slices_supported: [asset_class, plant, line, criticality, failure_mode]
  unit: minutes
  direction: lower_is_better
  target: 180.0
  source_of_record: DP-MFG-003
  forum_approved_at: 2026-09-05
  last_reviewed: 2026-09-05
  review_months: 12
  synonyms: ["MTTR", "repair time"]
