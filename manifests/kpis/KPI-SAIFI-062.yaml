apiVersion: marketplace/v1
kind: Kpi
metadata:
  id: KPI-SAIFI-062
  name: "SAIFI"
  domain: network_asset
  steward: PTY-0043
  status: certified
spec:
  business_definition: >-
    System Average Interruption Frequency Index: total sustained customer interruptions divided
    by customers served.
  numerator_expr: "sum(customer_interruptions)"
  denominator_expr: "count(distinct served_customer_id)"
  grains_supported: [month, quarter, year]
  slices_supported: [feeder, region, cause_class]
  unit: count
  direction: lower_is_better
  target: 1.1
  source_of_record: DP-UTL-001
  forum_approved_at: 2026-05-18
  last_reviewed: 2026-07-01
  review_months: 12
  synonyms: ["interruption frequency index"]
