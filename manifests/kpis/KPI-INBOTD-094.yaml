apiVersion: marketplace/v1
kind: Kpi
metadata:
  id: KPI-INBOTD-094
  name: "Inbound On-Time Rate"
  domain: supply_chain
  steward: PTY-0046
  status: certified
spec:
  business_definition: >-
    Share of receipt lines that arrived on or before the date the supplier promised. Against the
    promised date, not the requested one: the promise is what was agreed.
  numerator_expr: "count(*) filter (where on_time)"
  denominator_expr: "count(*)"
  grains_supported: [month, quarter, year]
  slices_supported: [supplier_id, supplier_tier, material_class, plant, region]
  unit: percent
  direction: higher_is_better
  target: 95.0
  source_of_record: DP-MFG-002
  forum_approved_at: 2026-09-04
  last_reviewed: 2026-09-04
  review_months: 12
  synonyms: ["inbound OTD", "supplier on-time"]
