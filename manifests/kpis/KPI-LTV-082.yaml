apiVersion: marketplace/v1
kind: Kpi
metadata:
  id: KPI-LTV-082
  name: "Average Loan to Value"
  domain: finance
  steward: PTY-0034
  status: certified
spec:
  business_definition: >-
    Outstanding balance over collateral value across secured lending. Unsecured accounts carry
    no collateral and are excluded from both halves rather than counted as zero.
  numerator_expr: "sum(outstanding_balance) filter (where collateral_value > 0)"
  denominator_expr: "sum(collateral_value)"
  grains_supported: [month, quarter, year]
  slices_supported: [product_type, region, risk_grade, vintage_band]
  unit: percent
  direction: lower_is_better
  target: 68.0
  source_of_record: DP-BNK-003
  forum_approved_at: 2026-09-04
  last_reviewed: 2026-09-04
  review_months: 12
  synonyms: ["LTV", "loan to value"]
