apiVersion: marketplace/v1
kind: Kpi
metadata:
  id: KPI-FPY-072
  name: "First Pass Yield"
  domain: operations
  steward: PTY-0046
  status: certified
spec:
  business_definition: >-
    Share of units passing all quality checks on the first attempt, without rework or
    reinspection.
  numerator_expr: "count(*) filter (where passed_without_rework)"
  denominator_expr: "count(*)"
  grains_supported: [day, week, month, quarter]
  slices_supported: [line, plant, shift, product_family]
  unit: percent
  direction: higher_is_better
  target: 96.0
  source_of_record: DP-MFG-001
  forum_approved_at: 2026-05-18
  last_reviewed: 2026-07-01
  review_months: 12
  synonyms: ["FPY", "right first time"]
