apiVersion: marketplace/v1
kind: Kpi
metadata:
  id: KPI-BACKLOG-025
  name: "Alert Backlog Age"
  domain: risk_compliance
  steward: PTY-0035
  status: certified
spec:
  business_definition: >-
    Ninetieth percentile age in days of alerts still awaiting disposition at period end.
  expression: "percentile_cont(0.9) within group (order by age_days) filter (where disposition is null)"
  grains_supported: [day, week, month]
  slices_supported: [typology, business_line, investigator_team]
  unit: days
  direction: lower_is_better
  target: 30.0
  source_of_record: DP-BNK-002
  forum_approved_at: 2026-05-18
  last_reviewed: 2026-07-01
  review_months: 12
  synonyms: ["queue age", "aged alerts"]
