spec:
  business_definition: >-
    Units scrapped as a share of units started, valued at standard cost for the financial view.
  numerator_expr: "sum(scrapped_units)"
  denominator_expr: "sum(started_units)"
  grains_supported: [day, week, month, quarter]
  slices_supported: [line, plant, product_family, root_cause]
  unit: percent
  direction: lower_is_better
  target: 1.5
  source_of_record: DP-MFG-001
  forum_approved_at: 2026-05-18
  last_reviewed: 2026-07-01
  review_months: 12
  synonyms: ["scrap", "yield loss"]
