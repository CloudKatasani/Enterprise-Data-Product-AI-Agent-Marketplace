apiVersion: marketplace/v1
kind: Kpi
metadata:
  id: KPI-MAPE-054
  name: "Forecast Accuracy MAPE"
  domain: supply_chain
  steward: PTY-0041
  status: certified
spec:
  business_definition: >-
    Mean absolute percentage error of the demand forecast against realised units, weighted by
    volume.
  numerator_expr: "sum(abs(forecast_units - actual_units))"
  denominator_expr: "sum(actual_units)"
  grains_supported: [week, month, quarter]
  slices_supported: [category, region, horizon]
  unit: percent
  direction: lower_is_better
  target: 22.0
  source_of_record: DP-RTL-002
  forum_approved_at: 2026-05-18
  last_reviewed: 2026-07-01
  review_months: 12
  synonyms: ["MAPE", "forecast error"]
