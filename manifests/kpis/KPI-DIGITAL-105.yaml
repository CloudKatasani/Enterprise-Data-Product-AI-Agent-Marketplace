apiVersion: marketplace/v1
kind: Kpi
metadata:
  id: KPI-DIGITAL-105
  name: "Digital Enrolment Rate"
  domain: customer
  steward: PTY-0036
  status: certified
spec:
  business_definition: >-
    Share of customers registered on a digital servicing channel. The denominator is every
    customer, including those who will never register, because that is the population.
  numerator_expr: "count(distinct customer_id) filter (where digital_registered)"
  denominator_expr: "count(distinct customer_id)"
  grains_supported: [month, quarter, year]
  slices_supported: [segment, region, distribution_channel, tenure_band]
  unit: percent
  direction: higher_is_better
  target: 62.0
  source_of_record: DP-INS-003
  forum_approved_at: 2026-09-04
  last_reviewed: 2026-09-04
  review_months: 12
  synonyms: ["digital adoption", "portal registration"]
