apiVersion: marketplace/v1
kind: Kpi
metadata:
  id: KPI-FILLRATE-095
  name: "Supplier Fill Rate"
  domain: supply_chain
  steward: PTY-0046
  status: certified
spec:
  business_definition: >-
    Units received over units ordered. A short shipment and a late one are different failures,
    and this measure is about the first.
  numerator_expr: "sum(received_units)"
  denominator_expr: "sum(ordered_units)"
  grains_supported: [month, quarter, year]
  slices_supported: [supplier_id, supplier_tier, material_class, plant, region]
  unit: percent
  direction: higher_is_better
  target: 98.0
  source_of_record: DP-MFG-002
  forum_approved_at: 2026-09-04
  last_reviewed: 2026-09-04
  review_months: 12
  synonyms: ["fill rate", "order completeness"]
