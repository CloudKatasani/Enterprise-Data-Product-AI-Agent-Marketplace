apiVersion: marketplace/v1
kind: Kpi
metadata:
  id: KPI-LOSTSALES-055
  name: "Lost Sales Estimate"
  domain: supply_chain
  steward: PTY-0041
  status: certified
spec:
  business_definition: >-
    Modelled value of demand that could not be met because stock was unavailable, valued at
    average selling price.
  expression: "sum(unmet_demand_units * average_selling_price)"
  grains_supported: [week, month, quarter]
  slices_supported: [category, region, store_format]
  unit: currency
  direction: lower_is_better
  source_of_record: DP-RTL-002
  forum_approved_at: 2026-05-18
  last_reviewed: 2026-07-01
  review_months: 12
  synonyms: ["lost revenue", "unmet demand value"]
