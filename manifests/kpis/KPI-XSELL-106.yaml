apiVersion: marketplace/v1
kind: Kpi
metadata:
  id: KPI-XSELL-106
  name: "Cross-Sell Acceptance"
  domain: customer
  steward: PTY-0036
  status: certified
spec:
  business_definition: >-
    Share of customers eligible for a cross-sell who took one. Measured against eligibility
    rather than against everyone, so a narrow targeting model does not read as a good one.
  numerator_expr: "count(distinct customer_id) filter (where cross_sell_accepted)"
  denominator_expr: "count(distinct customer_id) filter (where cross_sell_eligible)"
  grains_supported: [month, quarter, year]
  slices_supported: [segment, region, distribution_channel, tenure_band]
  unit: percent
  direction: higher_is_better
  target: 11.0
  source_of_record: DP-INS-003
  forum_approved_at: 2026-09-04
  last_reviewed: 2026-09-04
  review_months: 12
  synonyms: ["cross-sell rate", "offer acceptance"]
