apiVersion: marketplace/v1
kind: Kpi
metadata:
  id: KPI-SUPPDEF-093
  name: "Supplier Defect Rate"
  domain: supply_chain
  steward: PTY-0046
  status: certified
spec:
  business_definition: >-
    Units rejected at goods receipt over units received. Measured on units rather than receipts,
    so a single bad pallet does not weigh the same as a single bad container.
  numerator_expr: "sum(rejected_units)"
  denominator_expr: "sum(received_units)"
  grains_supported: [month, quarter, year]
  slices_supported: [supplier_id, supplier_tier, material_class, plant, region]
  unit: percent
  direction: lower_is_better
  target: 1.2
  source_of_record: DP-MFG-002
  forum_approved_at: 2026-09-04
  last_reviewed: 2026-09-04
  review_months: 12
  synonyms: ["defect rate", "reject rate"]
