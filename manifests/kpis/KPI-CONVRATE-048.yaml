apiVersion: marketplace/v1
kind: Kpi
metadata:
  id: KPI-CONVRATE-048
  name: "Conversion Rate"
  domain: customer
  steward: PTY-0040
  status: certified
spec:
  business_definition: >-
    Share of store or site visits that resulted in a purchase.
  numerator_expr: "count(distinct transaction_id)"
  denominator_expr: "count(distinct visit_id)"
  grains_supported: [day, week, month]
  slices_supported: [region, channel, store_format]
  unit: percent
  direction: higher_is_better
  target: 24.0
  source_of_record: DP-RTL-001
  forum_approved_at: 2026-05-18
  last_reviewed: 2026-07-01
  review_months: 12
  synonyms: ["visit conversion"]
