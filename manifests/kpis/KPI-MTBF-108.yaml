apiVersion: marketplace/v1
kind: Kpi
metadata:
  id: KPI-MTBF-108
  name: "Mean Time Between Failures"
  domain: network_asset
  steward: PTY-0053
  status: certified
spec:
  business_definition: >-
    Operating hours divided by the failures that interrupted them, across the installed
    equipment base. The measure a maintenance strategy is trying to move.
  numerator_expr: "sum(operating_hours)"
  denominator_expr: "count(distinct failure_id)"
  grains_supported: [month, quarter, year]
  slices_supported: [asset_class, plant, line, criticality, failure_mode]
  unit: hours
  direction: higher_is_better
  target: 2000.0
  source_of_record: DP-MFG-003
  forum_approved_at: 2026-09-05
  last_reviewed: 2026-09-05
  review_months: 12
  synonyms: ["MTBF", "time between failures"]
