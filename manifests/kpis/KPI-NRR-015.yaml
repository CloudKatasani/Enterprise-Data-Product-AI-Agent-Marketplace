apiVersion: marketplace/v1
kind: Kpi
metadata:
  id: KPI-NRR-015
  name: "Net Revenue Retention"
  domain: product
  steward: PTY-0033
  status: certified
spec:
  business_definition: >-
    Recurring revenue from the cohort of accounts present at period start, including expansion
    and contraction, divided by their starting revenue.
  numerator_expr: "sum(ending_recurring_revenue)"
  denominator_expr: "sum(starting_recurring_revenue)"
  grains_supported: [quarter, year]
  slices_supported: [plan_tier, segment, region]
  unit: percent
  direction: higher_is_better
  target: 112.0
  source_of_record: DP-TCH-001
  forum_approved_at: 2026-05-18
  last_reviewed: 2026-07-01
  review_months: 12
  synonyms: ["NRR", "net dollar retention"]
