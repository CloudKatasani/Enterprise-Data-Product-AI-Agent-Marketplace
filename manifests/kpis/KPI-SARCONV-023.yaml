apiVersion: marketplace/v1
kind: Kpi
metadata:
  id: KPI-SARCONV-023
  name: "SAR Conversion Rate"
  domain: risk_compliance
  steward: PTY-0035
  status: certified
spec:
  business_definition: >-
    Share of dispositioned alerts that resulted in a suspicious activity report being filed.
  numerator_expr: "count(*) filter (where sar_filed)"
  denominator_expr: "count(*) filter (where disposition is not null)"
  grains_supported: [month, quarter]
  slices_supported: [typology, business_line, region]
  unit: percent
  direction: higher_is_better
  target: 1.8
  source_of_record: DP-BNK-002
  forum_approved_at: 2026-05-18
  last_reviewed: 2026-07-01
  review_months: 12
  synonyms: ["SAR rate", "escalation yield"]
