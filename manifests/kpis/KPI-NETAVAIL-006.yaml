apiVersion: marketplace/v1
kind: Kpi
metadata:
  id: KPI-NETAVAIL-006
  name: "Network Availability"
  domain: network_asset
  steward: PTY-0032
  status: certified
spec:
  business_definition: >-
    Share of scheduled service minutes in which a site was available to carry traffic, excluding
    planned maintenance windows.
  numerator_expr: "sum(available_minutes)"
  denominator_expr: "sum(scheduled_minutes)"
  grains_supported: [day, week, month]
  slices_supported: [region, site_class, technology]
  unit: percent
  direction: higher_is_better
  target: 99.95
  source_of_record: DP-TEL-002
  forum_approved_at: 2026-05-18
  last_reviewed: 2026-07-01
  review_months: 12
  synonyms: ["site availability", "uptime"]
