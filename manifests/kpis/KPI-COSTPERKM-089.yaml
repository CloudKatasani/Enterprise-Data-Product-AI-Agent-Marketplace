apiVersion: marketplace/v1
kind: Kpi
metadata:
  id: KPI-COSTPERKM-089
  name: "Cost per Kilometre"
  domain: finance
  steward: PTY-0042
  status: certified
spec:
  business_definition: >-
    Total carrier cost over billable kilometres moved. Billable rather than driven, so an empty
    repositioning leg does not flatter the rate.
  numerator_expr: "sum(linehaul_cost) + sum(accessorial_cost) + sum(fuel_surcharge)"
  denominator_expr: "sum(billable_km)"
  grains_supported: [week, month, quarter]
  slices_supported: [lane, carrier, customer, mode, service_level, region]
  unit: currency
  direction: lower_is_better
  target: 1.55
  source_of_record: DP-TRN-002
  forum_approved_at: 2026-09-04
  last_reviewed: 2026-09-04
  review_months: 12
  synonyms: ["cost per km", "unit freight cost"]
