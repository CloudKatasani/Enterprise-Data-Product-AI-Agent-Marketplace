apiVersion: marketplace/v1
kind: Kpi
metadata:
  id: KPI-RETEN-002
  name: "Retention Rate"
  domain: customer
  steward: PTY-0031
  status: certified
spec:
  business_definition: >-
    Share of subscribers active at the start of the period who remained connected throughout it.
    The complement of churn rate on the same denominator.
  numerator_expr: "count(distinct subscriber_id) filter (where not churn_flag)"
  denominator_expr: "count(distinct subscriber_id) filter (where active_at_period_start)"
  grains_supported: [day, week, month, quarter]
  slices_supported: [segment, region, plan_type, tenure_band]
  unit: percent
  direction: higher_is_better
  target: 98.6
  source_of_record: DP-TEL-001
  forum_approved_at: 2026-05-18
  last_reviewed: 2026-07-01
  review_months: 12
  synonyms: ["survival rate"]
