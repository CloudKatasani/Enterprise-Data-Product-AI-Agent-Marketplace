apiVersion: marketplace/v1
kind: Kpi
metadata:
  id: KPI-READMIT-036
  name: "Thirty Day Readmission Rate"
  domain: clinical
  steward: PTY-0038
  status: certified
spec:
  business_definition: >-
    Share of eligible index discharges followed by an unplanned inpatient readmission within
    thirty days, using the standard planned-admission exclusions.
  numerator_expr: "count(distinct index_encounter_id) filter (where readmitted_within_30d)"
  denominator_expr: "count(distinct index_encounter_id) filter (where eligible_index)"
  grains_supported: [month, quarter, year]
  slices_supported: [condition, unit, payer, discharge_disposition]
  unit: percent
  direction: lower_is_better
  target: 11.5
  source_of_record: DP-HLT-001
  forum_approved_at: 2026-05-18
  last_reviewed: 2026-07-01
  review_months: 12
  synonyms: ["readmission rate", "30-day readmits"]
