apiVersion: marketplace/v1
kind: Kpi
metadata:
  id: KPI-AGENCY-099
  name: "Agency Hours Share"
  domain: operations
  steward: PTY-0038
  status: certified
spec:
  business_definition: >-
    Contract and agency hours as a share of hours worked. The premium the roster pays to cover
    what it could not fill from its own establishment.
  numerator_expr: "sum(agency_hours)"
  denominator_expr: "sum(worked_hours)"
  grains_supported: [day, week, month]
  slices_supported: [facility, region, unit_type, shift]
  unit: percent
  direction: lower_is_better
  target: 7.0
  source_of_record: DP-HLT-003
  forum_approved_at: 2026-09-04
  last_reviewed: 2026-09-04
  review_months: 12
  synonyms: ["agency usage", "contract labour share"]
