apiVersion: marketplace/v1
kind: Kpi
metadata:
  id: KPI-OTSHARE-098
  name: "Overtime Share of Hours"
  domain: operations
  steward: PTY-0038
  status: certified
spec:
  business_definition: >-
    Overtime hours as a share of hours worked. Against hours worked rather than hours budgeted,
    so a unit running short-staffed does not look better for it.
  numerator_expr: "sum(overtime_hours)"
  denominator_expr: "sum(worked_hours)"
  grains_supported: [day, week, month]
  slices_supported: [facility, region, unit_type, shift]
  unit: percent
  direction: lower_is_better
  target: 5.0
  source_of_record: DP-HLT-003
  forum_approved_at: 2026-09-04
  last_reviewed: 2026-09-04
  review_months: 12
  synonyms: ["overtime rate", "OT share"]
