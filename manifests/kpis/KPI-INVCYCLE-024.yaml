apiVersion: marketplace/v1
kind: Kpi
metadata:
  id: KPI-INVCYCLE-024
  name: "Investigation Cycle Time"
  domain: risk_compliance
  steward: PTY-0035
  status: certified
spec:
  business_definition: >-
    Median elapsed days from alert creation to final disposition for alerts closed within the
    period.
  expression: "percentile_cont(0.5) within group (order by investigation_days)"
  grains_supported: [week, month, quarter]
  slices_supported: [typology, business_line, investigator_team]
  unit: days
  direction: lower_is_better
  target: 12.0
  source_of_record: DP-BNK-002
  forum_approved_at: 2026-05-18
  last_reviewed: 2026-07-01
  review_months: 12
  synonyms: ["case cycle time"]
