apiVersion: marketplace/v1
kind: Kpi
metadata:
  id: KPI-PROVCOV-081
  name: "Provision Coverage"
  domain: finance
  steward: PTY-0034
  status: certified
spec:
  business_definition: >-
    Provisions held against the outstanding balance of defaulted accounts. Below one hundred per
    cent, the book is under-provisioned against what it has already recognised.
  numerator_expr: "sum(provision_amount)"
  denominator_expr: "sum(outstanding_balance) filter (where defaulted)"
  grains_supported: [month, quarter, year]
  slices_supported: [product_type, region, risk_grade]
  unit: percent
  direction: higher_is_better
  target: 95.0
  source_of_record: DP-BNK-003
  forum_approved_at: 2026-09-04
  last_reviewed: 2026-09-04
  review_months: 12
  synonyms: ["coverage ratio", "provision cover"]
