apiVersion: marketplace/v1
kind: Taxonomy
taxonomy: domain
entries:
  - code: customer
    label: Customer
    description: Subscriber, account, household and member state and behaviour.
    rank_order: 1
  - code: network_asset
    label: Network & Asset
    description: Physical network, plant and equipment health, faults and performance.
    rank_order: 2
  - code: product
    label: Product
    description: Product and feature definition, usage, adoption and portfolio performance.
    rank_order: 3
  - code: risk_compliance
    label: Risk & Compliance
    description: Financial crime, regulatory obligation, surveillance and control testing.
    rank_order: 4
  - code: risk
    label: Risk
    description: Underwriting, claims and loss exposure across an insured portfolio.
    rank_order: 5
  - code: clinical
    label: Clinical
    description: Patient encounters, care pathways, outcomes and clinical quality.
    rank_order: 6
  - code: supply_chain
    label: Supply Chain
    description: Inventory, replenishment, sourcing and distribution performance.
    rank_order: 7
  - code: operations
    label: Operations
    description: Execution performance across sites, shifts, lanes and lines.
    rank_order: 8
  - code: finance
    label: Finance
    description: Revenue, cost, margin and financial planning measures.
    rank_order: 9
