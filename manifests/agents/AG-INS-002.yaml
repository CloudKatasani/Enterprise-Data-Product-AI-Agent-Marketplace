apiVersion: marketplace/v1
kind: Agent
metadata:
  id: AG-INS-002
  name: "Underwriting Portfolio Copilot"
  industry: insurance
  domain: product
  owner:
    party_id: PTY-0037
    team: "Underwriting Analytics"
    on_call: "pagerduty://underwriting-agents"
  autonomy_level: L1
  certification: certified
spec:
  capability_statement: >-
    Answers questions about rate adequacy, retention, conversion and exposure concentration
    across the underwriting portfolio.
  business_value_block:
    analyses: [adequacy_ranking, concentration, trend_segmented, variance_to_plan, scenario_framing]
    replaces: >-
      Actuarial extracts refreshed quarterly and reshaped by hand for each portfolio review.
    personas: [underwriting_manager, portfolio_actuary, distribution_lead]
  out_of_scope:
    - "Binding authority"
    - "Rate filing"
    - "Individual risk acceptance"
  runtime:
    provider: analytic
    model:
      provider: anthropic
      id: marketplace-analytic-v1
      temperature: 0.0
      max_tokens: 2000
    prompt_ref: prompts/AG-INS-002/system@v1
  data_products:
    - product_id: DP-INS-002
      columns: [policy_id, quote_id, as_of_month, coverage_line, segment, region, county, channel, peril, written_premium, charged_premium, technical_premium, total_insured_value, in_top_accumulation_zone, up_for_renewal, renewed, bound, rate_change_pct]
      access: read
  tool_bindings:
    - tool: query_dp_ins_002
      endpoint: "mcp://marketplace.${TENANT}.internal/dp/DP-INS-002"
      scope: "dp:DP-INS-002:read"
      cost_class: small
      row_limit: 10000
    - tool: get_kpi_definition
      scope: "kpi:read"
      cost_class: trivial
    - tool: get_quality
      scope: "quality:read"
      cost_class: trivial
  kpi_coverage:
    - kpi_id: KPI-RATEADQ-034
      source_product: DP-INS-002
      columns_used: [policy_id, charged_premium, technical_premium, coverage_line, segment, region, as_of_month]
      grains: [quarter, year]
      slices: [coverage_line, segment, region]
      analysis_depth: rank_drivers
    - kpi_id: KPI-EXPCONC-035
      source_product: DP-INS-002
      columns_used: [policy_id, total_insured_value, in_top_accumulation_zone, peril, county, region, coverage_line, as_of_month]
      grains: [quarter, year]
      slices: [peril, region, coverage_line]
      analysis_depth: report
    - kpi_id: KPI-QTB-033
      source_product: DP-INS-002
      columns_used: [quote_id, bound, coverage_line, segment, channel, as_of_month]
      grains: [week, month, quarter]
      slices: [coverage_line, segment, channel]
      analysis_depth: compare
    - kpi_id: KPI-POLRETEN-032
      source_product: DP-INS-002
      columns_used: [policy_id, up_for_renewal, renewed, rate_change_pct, coverage_line, segment, region, channel, as_of_month]
      grains: [month, quarter, year]
      slices: [coverage_line, segment, region, channel]
      analysis_depth: explain
  guardrails:
    grounding:
      require_citation_on_numerics: true
      on_failure: return_error
    injection_defence: v3
    output_filters: [pii_pattern, credential_pattern]
    refusal_policy: >-
      State the boundary in one sentence, name the agent or data product that does cover the
      question, and offer a handoff or a new-supply request.
  budgets:
    p95_latency_ms: 6000
    cost_per_answer_usd: 0.06
  demo_exchanges:
    - id: DEMO-AG-INS-002-01
      ordinal: 1
      question: "Where is rate adequacy weakest in the commercial property book?"
      kpi_class: KPI-RATEADQ-034
      analysis_type: adequacy_ranking
      expected_shape:
        headline: >-
          the segments priced furthest below technical, and the premium exposed
        visual: scatter
        table_columns: [segment, rate_adequacy, written_premium, gap_pct]
        must_cite: [DP-INS-002, KPI-RATEADQ-034]
      data_tier: demo
      max_latency_ms: 6000
      golden_answer_ref: seed/golden/AG-INS-002/q1.json
      tolerance_pct: 2.0
    - id: DEMO-AG-INS-002-02
      ordinal: 2
      question: "What is our exposure concentration by county for wind peril?"
      kpi_class: KPI-EXPCONC-035
      analysis_type: concentration
      expected_shape:
        headline: >-
          where insured value piles up for the peril, and how much sits in the largest zone
        visual: map_plus_table
        table_columns: [county, total_insured_value, concentration_pct, policies]
        must_cite: [DP-INS-002, KPI-EXPCONC-035]
      data_tier: demo
      max_latency_ms: 6000
      golden_answer_ref: seed/golden/AG-INS-002/q2.json
      tolerance_pct: 2.0
    - id: DEMO-AG-INS-002-03
      ordinal: 3
      question: "How has quote-to-bind moved since the July rate change?"
      kpi_class: KPI-QTB-033
      analysis_type: trend_segmented
      expected_shape:
        headline: >-
          whether conversion moved after the change, and for which segments
        visual: line
        table_columns: [period, segment, quote_to_bind_rate, delta_pp]
        must_cite: [DP-INS-002, KPI-QTB-033]
      data_tier: demo
      max_latency_ms: 6000
      golden_answer_ref: seed/golden/AG-INS-002/q3.json
      tolerance_pct: 2.0
    - id: DEMO-AG-INS-002-04
      ordinal: 4
      question: "Which segments are we retaining below plan?"
      kpi_class: KPI-POLRETEN-032
      analysis_type: variance_to_plan
      expected_shape:
        headline: >-
          the segments retaining below plan and the premium at stake
        visual: bar
        table_columns: [segment, retention_rate, plan_rate, variance_pp]
        must_cite: [DP-INS-002, KPI-POLRETEN-032]
      data_tier: demo
      max_latency_ms: 6000
      golden_answer_ref: seed/golden/AG-INS-002/q4.json
      tolerance_pct: 2.0
    - id: DEMO-AG-INS-002-05
      ordinal: 5
      question: "What would a 5% increase on the worst-performing segment do to retention?"
      kpi_class: KPI-POLRETEN-032
      analysis_type: scenario_framing
      expected_shape:
        headline: >-
          the observed relationship between rate change and retention, framed as a direction rather
          than a forecast
        visual: elasticity_curve_directional
        table_columns: [rate_change_band, retention_rate, policies, delta_pp]
        must_cite: [DP-INS-002, KPI-POLRETEN-032]
      data_tier: demo
      max_latency_ms: 6000
      golden_answer_ref: seed/golden/AG-INS-002/q5.json
      tolerance_pct: 2.0
  evaluation:
    suites: [golden_accuracy, groundedness, boundary_refusal, adversarial, entitlement, compositional_exposure, consistency, cost_latency]
    pass_threshold_pct: 92
    cases_ref: seed/eval/AG-INS-002/
  value_case:
    benefit_model: "rate_correction_on_inadequate_segments * written_premium_exposed"
    attribution_confidence: medium
    assumptions:
      - text: "avg manual minutes per portfolio question"
        value: 65
        unit: minutes
        sample_size: 19
        source: "analyst time study"
        dated: 2026-06-01
    review:
      last_reviewed: 2026-07-20
      reviewer: PTY-0037
