apiVersion: marketplace/v1
kind: Agent
metadata:
  id: AG-TRN-001
  name: "Delivery SLA Sentinel"
  industry: transportation
  domain: operations
  owner:
    party_id: PTY-0052
    team: "Fleet Operations"
    on_call: "pagerduty://fleet-agents"
  autonomy_level: L1
  certification: certified
spec:
  capability_statement: >-
    Answers questions about on-time delivery, dwell, cost per mile and exception rates, and
    explains which lane or facility is eroding service.
  business_value_block:
    analyses: [performance_ranking, root_cause, utilization_impact, like_for_like, risk_forecast]
    replaces: >-
      The daily carrier scorecard assembled manually by the operations analytics team.
    personas: [operations_manager, carrier_manager, customer_service_lead]
  out_of_scope:
    - "Dispatch changes"
    - "Carrier contracting"
    - "Driver performance actions"
  runtime:
    provider: mock
    model:
      provider: anthropic
      id: marketplace-analytic-v1
      temperature: 0.0
      max_tokens: 2000
    prompt_ref: prompts/AG-TRN-001/system@v1
  data_products:
    - product_id: DP-TRN-001
      columns: [shipment_leg_id, shipment_id, departure_timestamp, lane, carrier, customer, service_level, facility, equipment_type, region, exception_type, delivery_attempted, delivered_within_window, exception_logged, loaded_miles, linehaul_cost, accessorial_cost, dwell_hours, revenue_hours, available_hours, sla_penalty_risk]
      access: read
  tool_bindings:
    - tool: query_dp_trn_001
      endpoint: "mcp://marketplace.${TENANT}.internal/dp/DP-TRN-001"
      scope: "dp:DP-TRN-001:read"
      cost_class: small
      row_limit: 10000
    - tool: get_kpi_definition
      scope: "kpi:read"
      cost_class: trivial
    - tool: get_quality
      scope: "quality:read"
      cost_class: trivial
  kpi_coverage:
    - kpi_id: KPI-OTD-056
      source_product: DP-TRN-001
      columns_used: [shipment_leg_id, delivery_attempted, delivered_within_window, lane, carrier, customer, service_level, region, departure_timestamp]
      grains: [day, week, month, quarter]
      slices: [lane, carrier, customer, service_level]
      analysis_depth: rank_drivers
    - kpi_id: KPI-DWELL-058
      source_product: DP-TRN-001
      columns_used: [shipment_leg_id, dwell_hours, facility, carrier, equipment_type, revenue_hours, available_hours, departure_timestamp]
      grains: [day, week, month]
      slices: [facility, carrier, equipment_type]
      analysis_depth: explain
    - kpi_id: KPI-CPM-057
      source_product: DP-TRN-001
      columns_used: [shipment_leg_id, linehaul_cost, accessorial_cost, loaded_miles, lane, carrier, equipment_type, departure_timestamp]
      grains: [week, month, quarter]
      slices: [lane, carrier, equipment_type]
      analysis_depth: compare
    - kpi_id: KPI-EXCRATE-060
      source_product: DP-TRN-001
      columns_used: [shipment_leg_id, exception_logged, exception_type, lane, carrier, customer, sla_penalty_risk, departure_timestamp]
      grains: [day, week, month]
      slices: [lane, carrier, exception_type]
      analysis_depth: rank_drivers
  guardrails:
    grounding:
      require_citation_on_numerics: true
      on_failure: return_error
    injection_defence: v3
    output_filters: [pii_pattern, credential_pattern]
    refusal_policy: >-
      State the boundary in one sentence, name the agent or data product that does cover the
      question, and offer a handoff or a new-supply request.
  budgets:
    p95_latency_ms: 6000
    cost_per_answer_usd: 0.06
  demo_exchanges:
    - id: DEMO-AG-TRN-001-01
      ordinal: 1
      question: "What is on-time delivery this week and where is it worst?"
      kpi_class: KPI-OTD-056
      analysis_type: performance_ranking
      expected_shape:
        headline: >-
          the estate on-time rate and the lanes furthest below it
        visual: bar_plus_map
        table_columns: [lane, on_time_rate, deliveries, delta_pp]
        must_cite: [DP-TRN-001, KPI-OTD-056]
      data_tier: demo
      max_latency_ms: 6000
      golden_answer_ref: seed/golden/AG-TRN-001/q1.json
      tolerance_pct: 2.0
    - id: DEMO-AG-TRN-001-02
      ordinal: 2
      question: "What is driving late deliveries on the Northeast lanes?"
      kpi_class: KPI-OTD-056
      analysis_type: root_cause
      expected_shape:
        headline: >-
          whether transit or dwell explains the lateness, and at which facilities
        visual: contribution_analysis
        table_columns: [facility, dwell_hours, late_deliveries, contribution_pct]
        must_cite: [DP-TRN-001, KPI-OTD-056]
      data_tier: demo
      max_latency_ms: 6000
      golden_answer_ref: seed/golden/AG-TRN-001/q2.json
      tolerance_pct: 2.0
    - id: DEMO-AG-TRN-001-03
      ordinal: 3
      question: "Where is dwell time eroding asset utilization?"
      kpi_class: KPI-DWELL-058
      analysis_type: utilization_impact
      expected_shape:
        headline: >-
          the facilities where dwell is costing the most revenue hours
        visual: quantified
        table_columns: [facility, median_dwell_hours, utilization_pct, revenue_hours_lost]
        must_cite: [DP-TRN-001, KPI-DWELL-058]
      data_tier: demo
      max_latency_ms: 6000
      golden_answer_ref: seed/golden/AG-TRN-001/q3.json
      tolerance_pct: 2.0
    - id: DEMO-AG-TRN-001-04
      ordinal: 4
      question: "How does cost per mile compare across carriers on the same lanes?"
      kpi_class: KPI-CPM-057
      analysis_type: like_for_like
      expected_shape:
        headline: >-
          where two carriers price differently on comparable lanes, and by how much
        visual: scatter
        table_columns: [lane, carrier, cost_per_mile, delta_pct]
        must_cite: [DP-TRN-001, KPI-CPM-057]
      data_tier: demo
      max_latency_ms: 6000
      golden_answer_ref: seed/golden/AG-TRN-001/q4.json
      tolerance_pct: 2.0
    - id: DEMO-AG-TRN-001-05
      ordinal: 5
      question: "Which customers are at risk of SLA penalty this month?"
      kpi_class: KPI-EXCRATE-060
      analysis_type: risk_forecast
      expected_shape:
        headline: >-
          the customers whose cumulative performance puts a penalty in reach
        visual: ranked_table
        table_columns: [customer, on_time_rate, exception_rate, legs]
        must_cite: [DP-TRN-001, KPI-EXCRATE-060]
      data_tier: demo
      max_latency_ms: 6000
      golden_answer_ref: seed/golden/AG-TRN-001/q5.json
      tolerance_pct: 2.0
  evaluation:
    suites: [golden_accuracy, groundedness, boundary_refusal, adversarial, entitlement, compositional_exposure, consistency, cost_latency]
    pass_threshold_pct: 92
    cases_ref: seed/eval/AG-TRN-001/
  value_case:
    benefit_model: "avoided_sla_penalties + detention_cost_reduction"
    attribution_confidence: medium
    assumptions:
      - text: "avg manual minutes per delivery performance question"
        value: 40
        unit: minutes
        sample_size: 35
        source: "analyst time study"
        dated: 2026-06-01
    review:
      last_reviewed: 2026-07-20
      reviewer: PTY-0052
