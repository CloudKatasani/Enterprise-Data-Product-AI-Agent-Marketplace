apiVersion: marketplace/v1
kind: Agent
metadata:
  id: AG-BNK-002
  name: "Financial Crime Triage"
  industry: banking
  domain: risk_compliance
  owner:
    party_id: PTY-0035
    team: "Financial Crime Operations"
    on_call: "pagerduty://fincrime-agents"
  autonomy_level: L2
  certification: certified
spec:
  capability_statement: >-
    Answers questions about surveillance alert volume, efficiency, backlog and investigator
    workload, and proposes a working order.
  business_value_block:
    analyses: [backlog_profile, efficiency_ranking, prioritization, before_after, workload]
    replaces: >-
      Monthly manual extract and pivot by the tuning team, plus daily queue triage by the
      investigations lead.
    personas: [investigations_lead, tuning_analyst, compliance_officer]
  out_of_scope:
    - "Filing a suspicious activity report"
    - "Closing an alert"
    - "Naming a customer as suspicious"
  runtime:
    provider: analytic
    model:
      provider: anthropic
      id: marketplace-analytic-v1
      temperature: 0.0
      max_tokens: 2000
    prompt_ref: prompts/AG-BNK-002/system@v1
  data_products:
    - product_id: DP-BNK-002
      columns: [alert_id, event_timestamp, typology, rule_id, business_line, region, investigator_team, disposition, sar_filed, investigation_days, age_days, alert_score, customer_risk_rating, transaction_count, transaction_value]
      access: read
  tool_bindings:
    - tool: query_dp_bnk_002
      endpoint: "mcp://marketplace.${TENANT}.internal/dp/DP-BNK-002"
      scope: "dp:DP-BNK-002:read"
      cost_class: small
      row_limit: 10000
    - tool: get_kpi_definition
      scope: "kpi:read"
      cost_class: trivial
    - tool: get_quality
      scope: "quality:read"
      cost_class: trivial
  kpi_coverage:
    - kpi_id: KPI-BACKLOG-025
      source_product: DP-BNK-002
      columns_used: [alert_id, age_days, disposition, typology, business_line, investigator_team, event_timestamp]
      grains: [day, week, month]
      slices: [typology, business_line, investigator_team]
      analysis_depth: report
    - kpi_id: KPI-FPRATE-022
      source_product: DP-BNK-002
      columns_used: [alert_id, disposition, typology, rule_id, business_line, event_timestamp]
      grains: [week, month, quarter]
      slices: [typology, business_line, rule_id]
      analysis_depth: rank_drivers
    - kpi_id: KPI-ALERTVOL-021
      source_product: DP-BNK-002
      columns_used: [alert_id, alert_score, customer_risk_rating, typology, business_line, region, event_timestamp]
      grains: [day, week, month]
      slices: [typology, business_line, region]
      analysis_depth: rank_drivers
    - kpi_id: KPI-SARCONV-023
      source_product: DP-BNK-002
      columns_used: [alert_id, sar_filed, disposition, rule_id, typology, business_line, event_timestamp]
      grains: [month, quarter]
      slices: [typology, business_line, region]
      analysis_depth: compare
    - kpi_id: KPI-INVCYCLE-024
      source_product: DP-BNK-002
      columns_used: [alert_id, investigation_days, investigator_team, typology, business_line, event_timestamp]
      grains: [week, month, quarter]
      slices: [typology, business_line, investigator_team]
      analysis_depth: explain
  guardrails:
    grounding:
      require_citation_on_numerics: true
      on_failure: return_error
    injection_defence: v3
    output_filters: [pii_pattern, credential_pattern]
    refusal_policy: >-
      State the boundary in one sentence, name the agent or data product that does cover the
      question, and offer a handoff or a new-supply request.
  budgets:
    p95_latency_ms: 6000
    cost_per_answer_usd: 0.06
  demo_exchanges:
    - id: DEMO-AG-BNK-002-01
      ordinal: 1
      question: "What is the alert backlog and its age profile?"
      kpi_class: KPI-BACKLOG-025
      analysis_type: backlog_profile
      expected_shape:
        headline: >-
          the size of the open queue and how much of it is aged
        visual: stacked_age_bars
        table_columns: [age_band, alerts, share_pct, oldest_days]
        must_cite: [DP-BNK-002, KPI-BACKLOG-025]
      data_tier: demo
      max_latency_ms: 6000
      golden_answer_ref: seed/golden/AG-BNK-002/q1.json
      tolerance_pct: 2.0
    - id: DEMO-AG-BNK-002-02
      ordinal: 2
      question: "Which typologies have the highest false positive rate?"
      kpi_class: KPI-FPRATE-022
      analysis_type: efficiency_ranking
      expected_shape:
        headline: >-
          the typologies producing the most no-action work, and their share of it
        visual: bar
        table_columns: [typology, false_positive_rate, alerts, share_pct]
        must_cite: [DP-BNK-002, KPI-FPRATE-022]
      data_tier: demo
      max_latency_ms: 6000
      golden_answer_ref: seed/golden/AG-BNK-002/q2.json
      tolerance_pct: 2.0
    - id: DEMO-AG-BNK-002-03
      ordinal: 3
      question: "Which alerts should be worked first today?"
      kpi_class: KPI-ALERTVOL-021
      analysis_type: prioritization
      expected_shape:
        headline: >-
          the proposed working order and the basis for it, for an investigator to accept or reject
        visual: ranked_queue_draft
        table_columns: [alert_id, typology, alert_score, age_days]
        must_cite: [DP-BNK-002, KPI-ALERTVOL-021]
      data_tier: demo
      max_latency_ms: 6000
      golden_answer_ref: seed/golden/AG-BNK-002/q3.json
      tolerance_pct: 2.0
    - id: DEMO-AG-BNK-002-04
      ordinal: 4
      question: "Has SAR conversion changed since the June rule tuning?"
      kpi_class: KPI-SARCONV-023
      analysis_type: before_after
      expected_shape:
        headline: >-
          whether conversion moved after the tuning, and for which rules
        visual: dual_axis
        table_columns: [period, sar_conversion_rate, alerts, delta_pp]
        must_cite: [DP-BNK-002, KPI-SARCONV-023]
      data_tier: demo
      max_latency_ms: 6000
      golden_answer_ref: seed/golden/AG-BNK-002/q4.json
      tolerance_pct: 2.0
    - id: DEMO-AG-BNK-002-05
      ordinal: 5
      question: "Which investigators are carrying aged alerts above SLA?"
      kpi_class: KPI-INVCYCLE-024
      analysis_type: workload
      expected_shape:
        headline: >-
          which teams are carrying the aged work and how much
        visual: table
        table_columns: [investigator_team, open_alerts, aged_alerts, median_cycle_days]
        must_cite: [DP-BNK-002, KPI-INVCYCLE-024]
      data_tier: demo
      max_latency_ms: 6000
      golden_answer_ref: seed/golden/AG-BNK-002/q5.json
      tolerance_pct: 2.0
  evaluation:
    suites: [golden_accuracy, groundedness, boundary_refusal, adversarial, entitlement, compositional_exposure, consistency, cost_latency]
    pass_threshold_pct: 92
    cases_ref: seed/eval/AG-BNK-002/
  value_case:
    benefit_model: "avoided_investigator_hours * loaded_rate + avoided_backlog_penalty"
    attribution_confidence: medium
    assumptions:
      - text: "avg manual minutes per surveillance question"
        value: 60
        unit: minutes
        sample_size: 23
        source: "analyst time study"
        dated: 2026-06-01
    review:
      last_reviewed: 2026-07-20
      reviewer: PTY-0035
